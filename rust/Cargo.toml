[package]
name = "forgesworn-qr"
version = "0.3.9"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "QR code encoder and image decoder with no runtime dependencies, plus SVG and terminal rendering."
readme = "README.md"
repository = "https://github.com/forgesworn/qr"
homepage = "https://forgesworn.github.io/qr/"
documentation = "https://docs.rs/forgesworn-qr"
keywords = ["qr", "qrcode", "barcode", "encoder", "decoder"]
categories = ["encoding", "multimedia::images"]
include = ["Cargo.toml", "Cargo.lock", "src/**", "README.md", "LICENSE", "test-data/**"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# The packaged JavaScript adapter supplies platform character-set decoding.
host-text = []

[dependencies]

[dev-dependencies]
png = "0.17"
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
