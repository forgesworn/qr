name: release embedded Rust crate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing embedded-vX.Y.Z GitHub release tag
        type: string
        required: true
      dry_run:
        description: Verify the package without publishing
        type: boolean
        default: true
      bootstrap:
        description: First publication using the temporary environment secret
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-rust-embedded
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Check the independent embedded release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'embedded-v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Expected embedded-vX.Y.Z'
          with open('rust/embedded/Cargo.toml', 'rb') as f:
              crate = tomllib.load(f)['package']
          assert crate['name'] == 'forgesworn-qr-embedded'
          assert crate['version'] == tag.removeprefix('embedded-v')
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft,isPrerelease']))
          assert not release['isDraft'] and not release['isPrerelease']
          PY
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: rustup toolchain install 1.87.0 --profile minimal
      - name: Verify shared conformance and the standalone distribution
        run: python3 scripts/check-embedded-package.py
      - name: Retain the verified package and check record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: embedded-verified
          path: rust/target/embedded-verified/
      - name: Obtain a short-lived publishing token
        if: ${{ !inputs.dry_run && !inputs.bootstrap }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish through trusted publishing
        if: ${{ !inputs.dry_run && !inputs.bootstrap }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +stable publish --locked --manifest-path rust/embedded/Cargo.toml --target-dir rust/target
      - name: Publish the first version
        if: ${{ !inputs.dry_run && inputs.bootstrap }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +stable publish --locked --manifest-path rust/embedded/Cargo.toml --target-dir rust/target
      - name: Verify public bytes and the exact registry dependency
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/verify-embedded-publication.py
