name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.13', 24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:package
      - run: npm run check:docs

  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew test :core:publishAllPublicationsToStagingRepository --console=plain --no-daemon --max-workers=2
      - name: Check Maven artefacts and isolated consumer
        working-directory: .
        run: python3 scripts/check-maven.py

  jsr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - run: node scripts/prepare-jsr.mjs --out "$RUNNER_TEMP/qr-jsr"
      - run: node scripts/check-jsr.mjs --stage "$RUNNER_TEMP/qr-jsr"
      - name: Verify actual publisher archive on loopback
        run: python3 scripts/check-jsr-upload.py --stage "$RUNNER_TEMP/qr-jsr"

  photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QR_REQUIRE_PHOTOS: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run fetch-photos
      - run: npx vitest run test/photos.test.ts --maxWorkers=1
      - run: ./gradlew test --console=plain --no-daemon --max-workers=2 --tests dev.forgesworn.qr.PhotosTest
        working-directory: kotlin

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      # Match the frozen module's compiler and verify the distributed bytes on Linux.
      - run: rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
      - run: rustup override set 1.96.0
      - run: cargo test --locked --all-features
      - name: Verify the published Rust crate and API documentation
        run: |
          cargo package --locked
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          cargo test --locked --lib --manifest-path "target/package/forgesworn-qr-$version/Cargo.toml" --target-dir "$PWD/target"
          cargo test --locked --doc --manifest-path "target/package/forgesworn-qr-$version/Cargo.toml" --target-dir "$PWD/target"
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - id: wasm-rebuild
        run: npm run check:wasm
        working-directory: .
      - name: Retain failed WASM rebuild diagnostics
        if: failure() && steps.wasm-rebuild.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-rebuild-diagnostics
          retention-days: 1
          path: |
            rust/target/wasm32-unknown-unknown/release/forgesworn_qr.wasm
            rust/target/wasm-check-report.json
      # The package uses host character sets (ABI 2). The standalone module
      # keeps the native port's text contract for these cross-port comparisons.
      - run: cargo build --locked --release --target wasm32-unknown-unknown -j 1
      - name: Compare WebAssembly results, options and encoding
        run: |
          node bench/wasm-pack.mjs
          node bench/wasm-options.mjs
          node bench/wasm-encode.mjs
      - name: Compare native and WebAssembly module-grid results and renderings
        run: |
          mkdir -p target/ci-conformance
          node bench/wasm-symbols.mjs grids target/ci-conformance/grids.json
          cargo run --locked --example symbols_dump -- target/ci-conformance/grids.json > target/ci-conformance/native-symbols.txt
          node bench/wasm-symbols.mjs check target/ci-conformance/native-symbols.txt target/ci-conformance/grids.json
          node bench/render-dump.mjs > target/ci-conformance/typescript-renderings.txt
          cargo run --locked --example render_dump > target/ci-conformance/native-renderings.txt
          cmp target/ci-conformance/typescript-renderings.txt target/ci-conformance/native-renderings.txt
      - name: Check WebAssembly memory is released after repeated reads
        run: node bench/wasm-leak.mjs

  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: rustup toolchain install 1.87.0 --profile minimal --target thumbv7em-none-eabi,riscv32imac-unknown-none-elf
      - name: Check source conformance in both configurations
        run: |
          cargo +stable test --locked --manifest-path rust/embedded/conformance/Cargo.toml --target-dir rust/target --no-default-features -- --nocapture
          cargo +stable test --locked --manifest-path rust/embedded/conformance/Cargo.toml --target-dir rust/target --all-features -- --nocapture
          cargo +stable clippy --locked --manifest-path rust/embedded/conformance/Cargo.toml --target-dir rust/target --all-targets --all-features -- -Dwarnings
          cargo +stable fmt --manifest-path rust/embedded/Cargo.toml --check
          cargo +stable fmt --manifest-path rust/embedded/conformance/Cargo.toml --check
      - name: Verify the actual embedded crate and Rust 1.87 consumer
        run: python3 scripts/check-embedded-package.py
      - name: Build without an operating system or allocator
        run: |
          for target in thumbv7em-none-eabi riscv32imac-unknown-none-elf; do
            cargo +1.87.0 build --locked --manifest-path rust/embedded/Cargo.toml --target-dir rust/target --release --target "$target" --no-default-features
            cargo +1.87.0 build --locked --manifest-path rust/embedded/Cargo.toml --target-dir rust/target --release --target "$target" --all-features
          done
