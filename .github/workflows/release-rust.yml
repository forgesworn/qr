name: release Rust crate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        type: string
        required: true
      bootstrap:
        description: First publication using the temporary environment secret
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-rust
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Check release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Expected a stable version tag'
          with open('Cargo.toml', 'rb') as f:
              crate = tomllib.load(f)['package']
          with open('../package.json') as f:
              npm = json.load(f)
          assert crate['version'] == npm['version'] == tag[1:]
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft,isPrerelease']))
          assert not release['isDraft'] and not release['isPrerelease']
          PY
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: rustup override set 1.96.0
      - run: cargo test --locked --all-features
      - name: Verify the standalone crate
        run: |
          cargo package --locked
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          cargo test --locked --lib --manifest-path "target/package/forgesworn-qr-$version/Cargo.toml" --target-dir "$PWD/target"
          cargo test --locked --doc --manifest-path "target/package/forgesworn-qr-$version/Cargo.toml" --target-dir "$PWD/target"
      - name: Obtain a short-lived publishing token
        if: ${{ !inputs.bootstrap }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish through trusted publishing
        if: ${{ !inputs.bootstrap }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      - name: Publish the first version
        if: ${{ inputs.bootstrap }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
