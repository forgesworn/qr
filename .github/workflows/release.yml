name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        type: string
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: forgesworn/anvil/.github/workflows/release.yml@v0
    with:
      tag: ${{ inputs.tag || '' }}
      test-command: npm run fetch-photos && QR_REQUIRE_PHOTOS=1 npm run check && npm run check:package && npm run check:docs
      lifecycle-scripts-policy: strict
